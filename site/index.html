<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD&amp;D Campaign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Tokens follow the character sheet: Cinzel display, Crimson Pro body, oxblood accent */
    :root {
      --bg: #f5f5f5; --surface: #ffffff; --ink: #1a1714; --ink-muted: #5a534e; --ink-faint: #9a9390;
      --rule: #d8d0c8; --accent: #8b2e12; --accent-hover: #6e2410; --bad: #9b2a1f;
      --radius: 4px; --ctl-h: 2.4rem;
      --font-display: 'Cinzel', Georgia, serif; --font-body: 'Crimson Pro', Georgia, serif;
      color-scheme: light;
    }
    /* Light only for now, like the tools; light and dark come to all of them together */
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.1rem; line-height: 1.45; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: var(--ctl-h); padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--accent); background: var(--accent); color: var(--surface); cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn:hover, .btn:focus-visible { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn.quiet { background: var(--surface); color: var(--ink-muted); border-color: var(--rule); }
    .btn.quiet:hover, .btn.quiet:focus-visible { color: var(--accent); border-color: var(--accent); background: var(--surface); }
    .btn.small { min-height: 1.9rem; padding: 0 10px; font-size: 0.62rem; }
    .hint { margin: 0; color: var(--ink-muted); font-size: 0.98rem; }
    .error { color: var(--bad); font-size: 0.95rem; margin: 0; min-height: 1.2em; }

    /* Signed out: the sign-in card, centred */
    .gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .gate main { width: 100%; max-width: 24rem; display: grid; gap: 20px; }
    .gate h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; font-size: clamp(1.5rem, 5vw, 2rem); margin: 0; padding-bottom: 10px; border-bottom: 2px solid var(--accent); text-align: center; }
    .card-form { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px 20px; display: grid; gap: 14px; }
    .card-form label { display: grid; gap: 4px; font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
    .card-form input { font: 1.05rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--rule); border-radius: var(--radius); padding: 9px 10px; }
    .card-form input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

    /* Signed in: your characters */
    .page { max-width: 60rem; margin: 0 auto; padding: 20px 16px 56px; display: grid; gap: 24px; }
    .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
    .top h1 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.04em; font-size: clamp(1.3rem, 4vw, 1.7rem); margin: 0; }
    .top .who { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink-muted); font-size: 0.95rem; }
    .top .who b { color: var(--ink); font-weight: 600; }
    h2 { font-family: var(--font-display); font-weight: 600; font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin: 0; }
    h2 .count { font-family: var(--font-body); letter-spacing: 0; text-transform: none; font-weight: 400; color: var(--ink-faint); margin-left: 6px; }
    section { display: grid; gap: 10px; }
    .section-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; align-content: start; position: relative; }
    .card.play { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); padding-left: 20px; }
    .card.dead { background: #f1eeec; }
    .card.dead .name { color: var(--ink-muted); }
    .name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.03em; margin: 0; overflow-wrap: anywhere; }
    .what { margin: 0; }
    .what.blank { color: var(--ink-faint); font-style: italic; }
    .meta { margin: 0; font-size: 0.9rem; color: var(--ink-faint); }
    .card .actions { margin-top: 4px; }
    .card .more { margin-left: auto; min-width: 2.2rem; padding: 0 8px; font-size: 1.1rem; letter-spacing: 0; font-family: var(--font-body); }
    .badge { font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; justify-self: start; }
    .badge.play { background: var(--accent); color: var(--surface); }
    .badge.dead { background: #3b3431; color: var(--surface); }
    .badge.given { border: 1px solid var(--rule); color: var(--ink-muted); }
    .menu { position: absolute; right: 12px; top: calc(100% - 8px); z-index: 5; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: 0 8px 22px rgba(26,23,20,.14); padding: 4px; min-width: 13rem; display: grid; }
    .menu button { font: inherit; font-size: 1rem; text-align: left; background: none; border: 0; border-radius: var(--radius); padding: 8px 10px; cursor: pointer; color: var(--ink); }
    .menu button:hover, .menu button:focus-visible { background: var(--bg); outline: none; }
    .menu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }
    .menu button.danger { color: var(--bad); }
    .btn.danger { background: var(--bad); border-color: var(--bad); }
    .btn.danger:hover, .btn.danger:focus-visible { background: #7a1f16; border-color: #7a1f16; }
    .slot { border: 1px dashed var(--rule); border-radius: var(--radius); padding: 16px; color: var(--ink-muted); display: grid; gap: 4px; }
    /* First visit: two ways in */
    .welcome { display: grid; gap: 6px; text-align: center; }
    .choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 14px; }
    .choice { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px 20px; cursor: pointer; display: grid; gap: 6px; color: var(--ink); }
    .choice:hover, .choice:focus-visible { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .choice .t { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--accent); }
    .choice .d { color: var(--ink-muted); font-size: 0.98rem; }
    .found { background: #fbf6ef; border: 1px solid #e6d3b4; border-radius: var(--radius); padding: 14px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
    .found p { margin: 0; flex: 1 1 18rem; }
    /* Bringing a character into play while another is */
    dialog { border: 1px solid var(--rule); border-radius: var(--radius); padding: 22px 22px 18px; max-width: 27rem; width: calc(100% - 32px); box-shadow: 0 12px 40px rgba(26,23,20,.25); }
    dialog::backdrop { background: rgba(26,23,20,.35); }
    dialog h3 { font-family: var(--font-display); font-size: 1.05rem; margin: 0 0 8px; }
    dialog p { margin: 0 0 12px; }
    dialog fieldset { border: 0; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
    dialog legend { font-family: var(--font-display); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px; }
    dialog label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    dialog input { accent-color: var(--accent); margin-top: 0.3rem; }
    dialog .row { display: flex; justify-content: flex-end; gap: 8px; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: var(--radius); font-size: 0.98rem; max-width: calc(100% - 32px); }
    .toast:empty { display: none; }
  </style>
</head>
<body>
  <!-- Signed out: sign in (accounts are made by the DM or an admin) -->
  <div class="gate" id="gate" hidden>
    <main>
      <h1>AD&amp;D Campaign</h1>
      <form class="card-form" id="signin" hidden>
        <label>Email<input type="email" name="email" autocomplete="username" required></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="submit">Sign in</button>
      </form>
      <p class="hint" id="offline" hidden>Sign-in isn't available right now.</p>
    </main>
  </div>

  <!-- Signed in: your characters -->
  <div class="page" id="home" hidden>
    <header class="top">
      <h1>AD&amp;D Campaign</h1>
      <div class="who">
        <span id="who"></span>
        <a class="btn quiet small" href="legacy/dm-helper.html" id="dm-link" hidden>DM Helper</a>
        <a class="btn quiet small" href="account.html">Account</a>
        <button class="btn quiet small" type="button" id="signout">Sign out</button>
      </div>
    </header>
    <main id="main"></main>
  </div>

  <input type="file" id="import-file" accept=".json,application/json" hidden>
  <dialog id="swap" aria-labelledby="swap-title">
    <form method="dialog">
      <h3 id="swap-title"></h3>
      <p id="swap-text"></p>
      <fieldset>
        <legend id="swap-legend"></legend>
        <label><input type="radio" name="to" value="dead" checked> <span>Dead</span></label>
        <label><input type="radio" name="to" value="backup"> <span>Backups</span></label>
      </fieldset>
      <div class="row"><button class="btn quiet" value="cancel">Cancel</button><button class="btn" value="ok">Bring into play</button></div>
    </form>
  </dialog>
  <dialog id="del" aria-labelledby="del-title" aria-describedby="del-text">
    <form method="dialog">
      <h3 id="del-title"></h3>
      <p id="del-text"></p>
      <div class="row"><button class="btn quiet" value="cancel" autofocus>Cancel</button><button class="btn danger" value="ok" id="del-ok">Delete</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status"></div>

  <!-- Supabase: signing in and your characters (src/cloud.js, src/characters.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
/* ── sheet converter: generated by scripts/build-legacy.mjs from src/ — do not edit by hand ── */
(() => {
const __m = {};
// ── cloud ──
__m["cloud"] = (() => {

// ── CLOUD (Supabase) ────────────────────────────────────────────
// Signing in, and the live round across devices. The database and its
// permission rules are in supabase/migrations/. The URL and publishable key
// below are public by design: the rules in the database decide what anyone
// can see or change. (The secret key never goes in the app.)
//
// The Supabase library comes from its CDN as window.supabase. Without it, or
// signed out, the tools work as before: the round syncs within one browser.

const CLOUD_URL = 'https://fslhlebezckjzpycrava.supabase.co';
const CLOUD_KEY = 'sb_publishable_qDPlezMIAsuQYfFuNDMcwg_f9iMsXA0';

let clientCache = null;
function cloudClient() {
  if (clientCache) return clientCache;
  try {
    const lib = globalThis.supabase;
    if (lib && lib.createClient) clientCache = lib.createClient(CLOUD_URL, CLOUD_KEY);
  } catch (e) { clientCache = null; }
  return clientCache;
}

// An account an admin made with a temporary password (supabase/add-player.sql):
// the player chooses their own, on the Account page, before anything else
const needsNewPassword = user => !!(user && user.user_metadata && user.user_metadata.temp_password);

// Who's signed in, and their campaign (the first one they're in, for now).
// newPassword: still on a temporary password.
// Null when signed out or the cloud can't be reached.
const cloudSession = async (client = cloudClient()) => {
  if (!client) return null;
  try {
    const { data } = await client.auth.getSession();
    const user = data && data.session && data.session.user;
    if (!user) return null;
    const [{ data: prof }, { data: rows }] = await Promise.all([
      client.from('profiles').select('display_name, is_admin').eq('id', user.id).maybeSingle(),
      client.from('campaign_members').select('campaign_id, role, campaigns(name)').eq('user_id', user.id),
    ]);
    const m = (rows || [])[0] || null;
    return {
      user, name: (prof && prof.display_name) || user.email, isAdmin: !!(prof && prof.is_admin), newPassword: needsNewPassword(user),
      campaignId: m ? m.campaign_id : null, campaignName: m && m.campaigns ? m.campaigns.name : '', role: m ? m.role : null,
    };
  } catch (e) { return null; }
};

// ── The live round through the database ──
// The same calls as createRoundSync (round-sync.js), so the sheet and the DM
// Helper don't care which one they have. The DM's side is one row per
// campaign (round_state); each character's round record is one row
// (round_records). A record from an earlier round is left out of the state.
// Changes show here at once and go to the database behind the scenes;
// everyone else hears about them through realtime.
// characterIds: names already known (the sheet opened from the account knows its own)
function createCloudRoundSync({ client, campaignId, userId, characterIds = {} }) {
  const listeners = [];
  let base = { round: 1, encounter: 1, foes: [], timing: 'end', dmAt: 0, at: 0 };
  let hasEncounter = false;   // the database has round_state.encounter (a migration)
  const rows = {};          // character name → { round, record }
  const ids = { ...characterIds };   // character name → character id
  const local = new Set();  // records written here before the first load
  const writes = {};        // character name → this page's saves, in order
  const state = () => {
    const records = {};
    Object.entries(rows).forEach(([name, r]) => { if (r.round === base.round) records[name] = { ...r.record, round: r.round }; });
    return { ...base, records };
  };
  const tell = () => { const s = state(); listeners.forEach(fn => { try { fn(s); } catch (e) { /* a listener's problem */ } }); };
  // Every round change reads the records again (a reset deletes them)
  const reload = () => client.from('round_records').select('*').eq('campaign_id', campaignId)
    .then(({ data }) => { Object.keys(rows).forEach(k => delete rows[k]); (data || []).forEach(fromRecord); tell(); }, () => {});
  const fromState = r => {
    if ('encounter' in r) hasEncounter = true;
    base = { round: r.round, encounter: r.encounter || 1, foes: r.foes || [], timing: r.timing || 'end', dmAt: Date.parse(r.updated_at) || Date.now(), at: Date.now() };
  };
  const fromRecord = r => {
    const name = r.record && r.record.character;
    if (!name) return;
    rows[name] = { round: r.round, record: r.record };
    ids[name] = r.character_id;
  };

  let dmChanges = null;     // the DM's changes made before the first load
  const ready = (async () => {
    const [{ data: st }, { data: recs }] = await Promise.all([
      client.from('round_state').select('*').eq('campaign_id', campaignId).maybeSingle(),
      client.from('round_records').select('*').eq('campaign_id', campaignId),
    ]);
    if (st) fromState(st);
    (recs || []).forEach(r => { if (!local.has(r.record && r.record.character)) fromRecord(r); });
    if (dmChanges) { applyDM(dmChanges); if (dmChanges.dm !== false) writeDM(); }
    tell();
  })().catch(() => {});

  const channel = client.channel(`round-${campaignId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'round_state', filter: `campaign_id=eq.${campaignId}` },
      p => { if (p.new && p.new.campaign_id) { const was = base.round; fromState(p.new); tell(); if (p.new.round !== was || p.new.round === 1) reload(); } })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'round_records', filter: `campaign_id=eq.${campaignId}` },
      p => {
        if (!p.new || !p.new.record) return;
        // An echo older than this page's last save of that character: stale
        const w = writes[p.new.record.character];
        if (w && w.sentAt && p.new.updated_at && Date.parse(p.new.updated_at) < Date.parse(w.sentAt)) return;
        fromRecord(p.new); tell();
      })
    .subscribe();

  // The character's row in the campaign, found by name (made if it's new)
  async function characterId(name) {
    if (ids[name]) return ids[name];
    const { data } = await client.from('characters').select('id').eq('campaign_id', campaignId).eq('name', name).limit(1);
    if (data && data[0]) return (ids[name] = data[0].id);
    const { data: made, error } = await client.from('characters')
      .insert({ campaign_id: campaignId, owner_id: userId, name, data: { name } }).select('id').single();
    if (error) throw error;
    return (ids[name] = made.id);
  }
  function applyDM({ round, foes, timing, dm = true, reset = false, resetInit = false }) {
    if (reset || resetInit) base.encounter = (base.encounter || 1) + 1;
    if (reset) { base.round = round ?? 1; Object.keys(rows).forEach(k => delete rows[k]); }
    else if (round != null) base.round = round;
    if (foes) base.foes = foes;
    if (timing) base.timing = timing;
    if (dm) base.dmAt = Date.now();
  }
  const writeDM = () => client.from('round_state').upsert({
    campaign_id: campaignId, round: base.round, foes: base.foes, timing: base.timing, updated_at: new Date().toISOString(),
    ...(hasEncounter ? { encounter: base.encounter } : {}),
  }).then(() => {}, () => {});

  let loaded = false;
  ready.then(() => { loaded = true; });
  return {
    live: true,
    cloud: true,
    state,
    sendRecord(rec) {
      const round = base.round;
      rows[rec.character] = { round, record: { ...rec, round } };
      if (!loaded) local.add(rec.character);
      // One save at a time per character, always the latest: quick changes
      // can't land out of order and undo each other
      const name = rec.character;
      const w = writes[name] || (writes[name] = { chain: Promise.resolve(), next: null });
      w.next = { round, record: rows[name].record, at: new Date().toISOString() };
      w.sentAt = w.next.at;
      w.chain = w.chain.then(() => {
        const job = w.next;
        if (!job) return null;
        w.next = null;
        return ready.then(() => characterId(name))
          .then(id => client.from('round_records').upsert({ character_id: id, campaign_id: campaignId, round: job.round, record: job.record, updated_at: job.at }));
      }).then(() => {}, () => {});
      return state();
    },
    sendDM(change) {
      // Before the first load, the database's round wins and these apply on top
      if (!loaded) { dmChanges = { ...(dmChanges || {}), ...change }; applyDM(change); return state(); }
      applyDM(change);
      // A reset deletes the campaign's records first, so pages that reload them find none
      if (change.reset) client.from('round_records').delete().eq('campaign_id', campaignId).then(writeDM, writeDM);
      else if (change.dm !== false) writeDM();
      return state();
    },
    onChange(fn) { listeners.push(fn); },
    close() { try { client.removeChannel(channel); } catch (e) { /* already gone */ } },
  };
}

// ── Sign in ──
// A small control for a tool's header: "Sign in" when signed out (opens a
// dialog: email and password; accounts are made by an admin), the name and
// campaign with Account and "Sign out" when signed in. Still on a temporary
// password: only a link to choose one, and the tool stays offline (onChange
// gets null). onChange gets the session (or null) on load and whenever it changes.
// The Account page sits beside the landing page, one folder up from the tools.
const ACCOUNT_URL = '../account.html', HOME_URL = '../index.html';
// opts.home: a link back to the landing page with this label (the sheet: "Your characters")
function mountCloud(el, onChange, opts = {}) {
  const client = cloudClient();
  if (!el || !client) { if (onChange) onChange(null); return; }
  const doc = el.ownerDocument;
  const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dialog = doc.createElement('dialog');
  dialog.className = 'cloud-dialog';
  dialog.innerHTML = `<form method="dialog" class="cloud-form">
      <h2 class="cloud-title">Sign in</h2>
      <label class="cloud-field">Email<input type="email" name="email" autocomplete="username" required></label>
      <label class="cloud-field">Password<input type="password" name="password" autocomplete="current-password" required></label>
      <p class="cloud-error" role="alert"></p>
      <div class="cloud-actions"><button type="button" class="cloud-cancel">Cancel</button><button type="submit" class="cloud-submit">Sign in</button></div>
    </form>`;
  doc.body.appendChild(dialog);
  const form = dialog.querySelector('form'), err = dialog.querySelector('.cloud-error');
  dialog.querySelector('.cloud-cancel').addEventListener('click', () => dialog.close());
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.textContent = '';
    const btn = form.querySelector('.cloud-submit'); btn.disabled = true;
    const { error } = await client.auth.signInWithPassword({ email: form.email.value.trim(), password: form.password.value });
    btn.disabled = false;
    if (error) { err.textContent = error.message || 'Could not sign in.'; return; }
    form.password.value = '';
    dialog.close();
  });

  let last = null;
  const paint = async () => {
    const got = await cloudSession(client);
    const s = got && got.newPassword ? null : got;
    const key = got ? `${got.user.id}|${got.campaignId}|${got.name}|${got.newPassword}` : '';
    if (got && got.newPassword) {
      el.innerHTML = `<a class="cloud-btn" href="${ACCOUNT_URL}">Choose your password</a>`;
    } else if (s) {
      el.innerHTML = `<span class="cloud-who">${esc(s.name)}${s.campaignName ? ` · ${esc(s.campaignName)}` : ' · no campaign yet'}</span> ${opts.home ? `<a class="cloud-btn" href="${HOME_URL}">${esc(opts.home)}</a> ` : ''}<a class="cloud-btn" href="${ACCOUNT_URL}">Account</a> <button type="button" class="cloud-btn">Sign out</button>`;
      el.querySelector('button').addEventListener('click', () => client.auth.signOut());
    } else {
      el.innerHTML = '<button type="button" class="cloud-btn">Sign in</button>';
      el.querySelector('button').addEventListener('click', () => { err.textContent = ''; dialog.showModal(); form.email.focus(); });
    }
    if (key !== last) { last = key; if (onChange) onChange(s); }
  };
  client.auth.onAuthStateChange(() => { setTimeout(paint, 0); });
