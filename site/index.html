/* Fields (docs/design-system.md: Sizes, States) */
:root { --field-h: var(--ctl-md); --field-fs: var(--ctl-fs-md); --field-px: var(--ctl-pad-md); }
.size-xs { --field-h: var(--ctl-xs); --field-fs: var(--ctl-fs-xs); --field-px: var(--ctl-pad-xs); }
.size-sm { --field-h: var(--ctl-sm); --field-fs: var(--ctl-fs-sm); --field-px: var(--ctl-pad-sm); }
.size-md { --field-h: var(--ctl-md); --field-fs: var(--ctl-fs-md); --field-px: var(--ctl-pad-md); }
.size-lg { --field-h: var(--ctl-lg); --field-fs: var(--ctl-fs-lg); --field-px: var(--ctl-pad-lg); }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field) {
  box-sizing: border-box; height: var(--field-h); min-height: 0; margin: 0; padding: 0 var(--field-px);
  font-family: var(--font-sans); font-size: var(--field-fs); font-weight: 500; font-style: normal; line-height: normal;
  letter-spacing: normal; text-transform: none; color: var(--color-text);
  background-color: var(--color-surface); background-image: none;
  border: 1px solid var(--color-border); border-radius: var(--radius-ctl); box-shadow: none; outline: none;
  transition: border-color .12s, background-color .12s;
}
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field):is(textarea) { height: auto; padding: 8px var(--field-px); line-height: 1.45; font-weight: 400; }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field):is(select) {
  -webkit-appearance: none; appearance: none; cursor: pointer; text-overflow: ellipsis;
  padding-right: calc(var(--field-px) + 1.2em);
  background-image: var(--chevron); background-repeat: no-repeat; background-position: right calc(var(--field-px) - 0.1em) center; background-size: 0.7em auto;
}
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field)::placeholder { color: var(--color-text-faint); opacity: 1; }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field):hover:not(:disabled):not(:focus):not([readonly]) { border-color: var(--color-text-muted); }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field):focus { border-color: var(--color-focus); outline: 2px solid var(--color-focus); outline-offset: 2px; }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field)[readonly] { background-color: var(--color-sunken); }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field):disabled { opacity: .45; cursor: not-allowed; }
:is(input:not([type]), input[type=text], input[type=number], input[type=email], input[type=password], input[type=search], input[type=url], input[type=tel], select, textarea):not(.ui-native):not(.open-field)[aria-invalid="true"] { border-color: var(--color-danger-text); }
/* A select's open list follows the theme */
select option { background-color: var(--color-raised); color: var(--color-text); }
/* Spin buttons, where a number field keeps them (class="has-spin"): our up/down
   icon in its right padding, no box behind it (src/ui/spin.js makes it work).
   The browser's own are hidden. */
input[type=number].has-spin:not(.ui-native) {
  -moz-appearance: textfield; appearance: textfield;
  padding-right: calc(var(--field-px) + 1em);
  background-image: var(--spin); background-repeat: no-repeat; background-position: right calc(var(--field-px) - 2px) center; background-size: 0.55em auto;
}
input[type=number].has-spin.open-field { padding-right: 1.1em; background-position: right 0 center; }
input[type=number].has-spin::-webkit-inner-spin-button, input[type=number].has-spin::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number].has-spin.on-spin { cursor: pointer; }

/* The open field */
:is(input, select, textarea).open-field {
  background-color: transparent; border: 0; border-bottom: 1px solid var(--color-border); border-radius: 0;
  box-shadow: none; outline: none; color: var(--color-text); transition: border-color .12s;
}
select.open-field { -webkit-appearance: none; appearance: none; cursor: pointer; padding-right: 1.4em;
  background-image: var(--chevron); background-repeat: no-repeat; background-position: right 0.1em center; background-size: 0.7em auto; }
:is(input, select, textarea).open-field:hover:not(:disabled):not(:focus):not([readonly]) { border-bottom-color: var(--color-accent-text); }
:is(input, select, textarea).open-field:focus { border-bottom: 2px solid var(--color-focus); margin-bottom: -1px; }
:is(input, select, textarea).open-field::placeholder { color: var(--color-text-faint); opacity: 1; }
:is(input, select, textarea).open-field:disabled { opacity: .45; cursor: not-allowed; }
:is(input, select, textarea).open-field[aria-invalid="true"] { border-bottom-color: var(--color-danger-text); }

    async function saveLocal(data, { keepLocal = false } = {}) {
      const blank = list.mine.find(c => c.blank && c.name === data.name);
      try {
        let id, status;
        if (blank) {
          id = blank.id; status = blank.status;
          await Characters.saveSheet(client, id, data);
          if (status !== 'play' && !list.mine.some(c => c.status === 'play')) { await Characters.setStatus(client, list.mine, id, 'play'); status = 'play'; }
        } else ({ id, status } = await Characters.createCharacter(client, session, data, { mine: list.mine }));
        if (!keepLocal) { try { localStorage.setItem(MOVED, id); } catch (e) { /* storage blocked */ } }
        await reload(); say(`${data.name} is saved to your account, ${placeText(status)}.`);
      } catch (e) { say(problem(e)); }
    }
    async function move(c, status, others) {
      try { await Characters.setStatus(client, list.mine, c.id, status, others); await reload(); }
      catch (e) { say(problem(e)); return false; }
      return true;
    }
    // Into play: one each. If another is in play, ask where it goes.
    function bringIn(c) {
      const cur = list.mine.find(x => x.status === 'play' && x.id !== c.id);
      if (!cur) { move(c, 'play').then(ok => ok && say(`${c.name} is in play.`)); return; }
      const d = $('swap');
      $('swap-title').textContent = `Bring ${c.name} into play?`;
      $('swap-text').textContent = `${cur.name} is in play now. One character each in the party.`;
      $('swap-legend').textContent = `Move ${cur.name} to`;
      d.querySelector('input[value="dead"]').checked = true;
      d.onclose = async () => {
        if (d.returnValue !== 'ok') return;
        const to = d.querySelector('input[name="to"]:checked').value;
        if (await move(c, 'play', to)) say(`${c.name} is in play; ${cur.name} moved to ${Characters.STATUS_LABEL[to]}.`);
      };
      d.returnValue = ''; d.showModal();
    }
    // Delete, for good: Backups and Dead only, after a confirmation (Cancel first)
    function remove(c) {
      const d = $('del');
      $('del-title').textContent = `Delete ${c.name}?`;
      $('del-text').textContent = `${c.name} and every saved version of the sheet will be gone for good. To keep a copy, choose Export file first.`;
      $('del-ok').textContent = `Delete ${c.name}`;
      d.onclose = async () => {
        if (d.returnValue !== 'ok') return;
        try {
          await Characters.deleteCharacter(client, c.id);
          try { localStorage.removeItem(`adnd-sheet:${c.id}`); } catch (e) { /* storage blocked */ }
          await reload(); say(`${c.name} is deleted.`);
        } catch (e) { say(problem(e)); }
      };
      d.returnValue = ''; d.showModal();
    }
    // The DM gives a backup to a player: it moves to their Backups
    function assign(c) {
      const d = $('assign'), host = $('assign-list');
      const players = members.filter(m => m.plays && m.id !== session.user.id);
      $('assign-title').textContent = `Assign ${c.name} to a player?`;
      $('assign-text').textContent = players.length ? `${c.name} moves to their Backups, ready for them to bring into play. You won’t see it here any more.` : 'There are no players in this campaign yet.';
      host.textContent = '';
      players.forEach((m, i) => { const l = el('label'); const r = el('input'); r.type = 'radio'; r.name = 'to'; r.value = m.id; r.checked = i === 0; l.append(r, ' ', el('span', '', m.name)); host.appendChild(l); });
      $('assign-ok').disabled = !players.length;
      d.onclose = async () => {
        if (d.returnValue !== 'ok') return;
        const to = d.querySelector('input[name="to"]:checked'); if (!to) return;
        const who = players.find(m => m.id === to.value);
        try { await Characters.assignCharacter(client, c.id, to.value); await reload(); say(`${c.name} is in ${who ? who.name + '’s' : 'their'} Backups.`); }
        catch (e) { say(problem(e)); }
      };
      d.returnValue = ''; d.showModal();
    }
    async function copyOf(c) {
      const data = { ...(c.data || {}), name: `${c.name} (copy)` };
      const st = c.status === 'unassigned' ? 'unassigned' : 'backup';
      try { await Characters.createCharacter(client, session, data, { mine: list.mine, status: st }); await reload(); say(`A copy of ${c.name} is ${placeText(st)}.`); }
      catch (e) { say(problem(e)); }
    }
    function exportFile(c) {
      const url = URL.createObjectURL(new Blob([JSON.stringify(c.data || { name: c.name }, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = Characters.fileName(c.data || { name: c.name }); a.click();
      URL.revokeObjectURL(url);
    }

    // ── Drawing ──
    function card(c, given, opts = {}) {
      const k = el('article', 'card' + (c.status === 'play' && !given ? ' play' : c.status === 'dead' ? ' dead' : ''));
      const nid = 'n-' + c.id; k.setAttribute('aria-labelledby', nid);
      if (given) k.appendChild(el('span', 'badge given', `${c.ownerName || 'Someone'}’s · you can play`));
      else if (opts.view && c.ownerName) k.appendChild(el('span', 'badge given', `${c.ownerName}’s`));
      else if (c.status === 'play') k.appendChild(el('span', 'badge play', 'In play'));
      else if (c.status === 'dead') k.appendChild(el('span', 'badge dead', 'Dead'));
      const n = el('h3', 'name', c.name); n.id = nid; k.appendChild(n);
      k.appendChild(el('p', 'what' + (c.summary ? '' : ' blank'), c.summary || (c.blank ? 'Not filled in yet' : '')));
      if (c.updatedAt) k.appendChild(el('p', 'meta', when(c.updatedAt)));
      const a = el('div', 'actions');
      const open = opts.view
        ? el('a', 'btn small ui-button is-secondary size-sm', 'View sheet')
        : el('a', 'btn small ui-button is-primary size-sm', 'Open sheet');
      open.href = sheetUrl(c.id) + (opts.view ? '&view=1' : '');
      open.setAttribute('aria-label', opts.view ? `View ${c.name}’s sheet (read only)` : `Open ${c.name}’s sheet`);
      a.appendChild(open);
      if (!given && !opts.view && !opts.dm && c.status !== 'play') {   // a player's own; not a Party card or a DM's backup
        const b = el('button', 'btn quiet small ui-button is-secondary size-sm', c.status === 'dead' ? 'Return to play' : 'Bring into play'); b.type = 'button';
        b.addEventListener('click', () => bringIn(c)); a.appendChild(b);
      }
      if (!given && !opts.view) {                                       // a Party card is for looking only
        const m = el('button', 'btn quiet small more ui-button is-secondary is-icon size-sm', '⋯'); m.type = 'button';
        m.setAttribute('aria-label', `More for ${c.name}`); m.setAttribute('aria-haspopup', 'true'); m.setAttribute('aria-expanded', String(openMenu === c.id));
        m.addEventListener('click', e => { e.stopPropagation(); openMenu = openMenu === c.id ? null : c.id; render(); if (openMenu) document.querySelector('.menu button')?.focus(); });
        a.appendChild(m);
      }
      k.appendChild(a);
      if (openMenu === c.id) {
        const menu = el('div', 'menu ui-menu'); menu.setAttribute('role', 'menu');
        const item = (t, fn) => { const b = el('button', '', t); b.type = 'button'; b.setAttribute('role', 'menuitem'); b.addEventListener('click', () => { openMenu = null; render(); fn(); }); menu.appendChild(b); };
        if (asDM() && (opts.dm || c.status !== 'play')) item('Assign to player\u2026', () => assign(c));
        if (!opts.dm) {
          if (c.status !== 'play') item('Bring into play', () => bringIn(c));
          if (c.status !== 'backup') item('Move to Backups', () => move(c, 'backup').then(ok => ok && say(`${c.name} moved to Backups.`)));
          if (c.status !== 'dead') item('Mark as dead', () => move(c, 'dead').then(ok => ok && say(`${c.name} is marked as dead.`)));
        }
        menu.appendChild(el('hr'));
        item('Make a copy', () => copyOf(c));
        item('Export file', () => exportFile(c));
        if (c.status !== 'play' || opts.dm) { menu.appendChild(el('hr')); item('Delete\u2026', () => remove(c)); menu.lastChild.classList.add('danger'); }
        k.appendChild(menu);
      }
      return k;
    }
    function section(title, n, extra, hint) {
      const s = el('section'), head = el('div', 'section-head'), h = el('h2', '', title);
      if (n > 1) h.appendChild(el('span', 'count', `(${n})`));
      head.appendChild(h); if (extra) head.appendChild(extra);
      s.appendChild(head); if (hint) s.appendChild(el('p', 'hint', hint));
      return s;
    }
    function render() {
      const main = $('main'); main.textContent = '';
      const wrap = el('div'); wrap.style.display = 'grid'; wrap.style.gap = '26px';
      if (!session.campaignId) { main.appendChild(el('p', 'hint', 'You’re not in a campaign yet. Ask your DM to add you.')); return; }
      if (loadError) wrap.appendChild(el('p', 'error', `Your characters couldn’t load: ${loadError}`));
      // A sheet from before accounts in this browser, not saved to the account yet
      const local = localSheet();
      if (local && local.name && !moved() && !list.mine.some(c => !c.blank && c.name === local.name)) {
        const f = el('div', 'found'), p = el('p');
        p.append('This browser has a sheet from before accounts: ', el('b', '', local.name), Characters.summary(local) ? `, ${Characters.summary(local)}.` : '.');
        const b = el('button', 'btn ui-button is-primary', 'Save it to your account'); b.type = 'button';
        b.addEventListener('click', () => { b.disabled = true; saveLocal(local); });
        f.append(p, b); wrap.appendChild(f);
      }
      const mine = list.mine;
      const both = asDM() && asPlayer();
      const showDM = asDM() && (!both || tab === 'dm'), showPlayer = asPlayer() && (!both || tab === 'player');
      if (both) {
        const nav = el('div', 'ui-pagetabs home-tabs'); nav.setAttribute('role', 'tablist'); nav.setAttribute('aria-label', 'Home');
        [['player', 'Player'], ['dm', 'DM']].forEach(([v, label]) => {
          const b = el('button', '', label); b.type = 'button'; b.id = 'tab-' + v;
          b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(tab === v)); b.tabIndex = tab === v ? 0 : -1;
          b.addEventListener('click', () => setTab(v));
          b.addEventListener('keydown', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); setTab(v === 'dm' ? 'player' : 'dm'); } });
          nav.appendChild(b);
        });
        wrap.prepend(nav);
      }
      if (showDM) {
        // The DM Helper: a choice card that goes there
        const go = el('div', 'choices dm-entry');
        const a = el('a', 'choice ui-choice'); a.href = 'legacy/dm-helper.html';
        a.append(el('span', 't', 'DM Helper'), el('span', 'd', 'Run the round: initiative, attacks, checks, saves and encounters.'));
        go.appendChild(a); wrap.appendChild(go);
        // The Party: each player's character in play, view only
        const ownerOf = id => (members.find(m => m.id === id) || {}).name || '';
        const sp = section('Party', party.length, null, party.length ? 'Each player’s character in play. View only.' : 'No one has a character in play yet.');
        if (party.length) {
          const cp = el('div', 'cards');
          party.forEach(p => cp.appendChild(card({ id: p.id, name: p.name, status: 'party', summary: Characters.summary(p.data), blank: Characters.isBlank(p.data), updatedAt: p.updatedAt, ownerName: ownerOf(p.ownerId) }, false, { view: true })));
          sp.appendChild(cp);
        }
        wrap.appendChild(sp);
        // Backups: characters made for players, not given to one yet. A DM who
        // doesn't play sees all of theirs here (any from before 'unassigned')
        const prep = mine.filter(c => !asPlayer() || c.status === 'unassigned');
        const add = el('div', 'actions');
        const nb = el('button', 'btn quiet small ui-button is-secondary size-sm', 'New character'); nb.type = 'button'; nb.addEventListener('click', () => newCharacter(true));
        const ib = el('button', 'btn quiet small ui-button is-secondary size-sm', 'Import file'); ib.type = 'button'; ib.addEventListener('click', () => importFile(true));
        add.append(nb, ib);
        const sb = section('Backups', prep.length, add, prep.length ? 'Characters you’ve made for players. Assign one when a player needs it.' : 'None yet. Make or import a character, then assign it to a player.');
        if (prep.length) { const cb = el('div', 'cards'); prep.forEach(c => cb.appendChild(card(c, false, { dm: true }))); sb.appendChild(cb); }
        wrap.appendChild(sb);
      }
      if (!showPlayer) { main.appendChild(wrap); return; }
      if (!mine.some(c => c.status !== 'unassigned')) {
        const w = el('div', 'welcome');
        w.append(el('h2', '', 'Your characters'), el('p', 'hint', 'You don’t have a character yet. Start one, or bring in a sheet you’ve already made.'));
        const ch = el('div', 'choices');
        const choice = (t, d, fn) => { const b = el('button', 'choice ui-choice'); b.type = 'button'; b.append(el('span', 't', t), el('span', 'd', d)); b.addEventListener('click', fn); return b; };
        ch.append(
          choice('Create a new character', 'A blank sheet, saved to your account as you fill it in.', () => newCharacter()),
          choice('Import a character file', 'A .json file exported from the character sheet.', () => importFile()));
        wrap.append(w, ch);
      } else {
        const add = el('div', 'actions');
        const nb = el('button', 'btn quiet small ui-button is-secondary size-sm', 'New character'); nb.type = 'button'; nb.addEventListener('click', () => newCharacter());
        const ib = el('button', 'btn quiet small ui-button is-secondary size-sm', 'Import file'); ib.type = 'button'; ib.addEventListener('click', () => importFile());
        add.append(nb, ib);
        const play = mine.filter(c => c.status === 'play');
        const s1 = section('In play', 0, add), c1 = el('div', 'cards');
        if (play.length) c1.appendChild(card(play[0]));
        else { const slot = el('div', 'slot'); slot.append(el('b', '', 'No character in play'), el('span', '', 'Bring in a backup, or start a new character.')); c1.appendChild(slot); }
        s1.appendChild(c1); wrap.appendChild(s1);
        const back = mine.filter(c => c.status === 'backup');
        const s2 = section('Backups', back.length, null, back.length ? 'Ready for the next session, if your character in play falls.' : 'None yet. A backup is ready for the next session, if your character in play falls.');
        if (back.length) { const c2 = el('div', 'cards'); back.forEach(c => c2.appendChild(card(c))); s2.appendChild(c2); }
        wrap.appendChild(s2);
        const dead = mine.filter(c => c.status === 'dead');
        if (dead.length) { const s3 = section('Dead', dead.length, null, 'Still yours to edit. They could come back.'); const c3 = el('div', 'cards'); dead.forEach(c => c3.appendChild(card(c))); s3.appendChild(c3); wrap.appendChild(s3); }
      }
      if (showPlayer && list.given.length) {
        const s4 = section('Shared with you', list.given.length, null, 'Characters others have let you play, until they take them back.');
        const c4 = el('div', 'cards'); list.given.forEach(c => c4.appendChild(card(c, true))); s4.appendChild(c4); wrap.appendChild(s4);
      }
      main.appendChild(wrap);
    }
    document.addEventListener('click', e => { if (openMenu && !e.target.closest('.menu')) { openMenu = null; render(); } });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !openMenu) return;
      const c = list.mine.find(x => x.id === openMenu); openMenu = null; render();
      if (c) document.querySelector(`[aria-label="More for ${CSS.escape(c.name)}"]`)?.focus();
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();
      $('error').textContent = '';
      const btn = form.querySelector('button'); btn.disabled = true;
      const { error } = await client.auth.signInWithPassword({ email: form.email.value.trim(), password: form.password.value });
      btn.disabled = false;
      if (error) { $('error').textContent = error.message || 'Could not sign in.'; return; }
      form.password.value = '';
      show();
    });
    $('signout').addEventListener('click', async () => { await client.auth.signOut(); show(); });
    show();
  })();
  </script>
</body>
</html>
