<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AD&amp;D Campaign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Tokens follow the character sheet: Cinzel display, Crimson Pro body, oxblood accent */
    :root {
      --bg: #f5f5f5; --surface: #ffffff; --ink: #1a1714; --ink-muted: #5a534e;
      --rule: #d8d0c8; --accent: #8b2e12; --accent-hover: #6e2410;
      --font-display: 'Cinzel', Georgia, serif; --font-body: 'Crimson Pro', Georgia, serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131110; --surface: #201c19; --ink: #eee7e1; --ink-muted: #b7aca4;
        --rule: #3a332e; --accent: #e0795a; --accent-hover: #eb9479;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1.125rem; line-height: 1.45; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; display: grid; gap: 28px; }
    h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.02em; margin: 0; }
    h1 { font-size: clamp(1.6rem, 5vw, 2.3rem); padding-bottom: 12px; border-bottom: 2px solid var(--accent); }
    h2 { font-size: 1.05rem; letter-spacing: 0.06em; }
    p { margin: 0; color: var(--ink-muted); }
    .tools { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
    .tools a { display: grid; gap: 6px; height: 100%; padding: 18px; background: var(--surface); border: 1px solid var(--rule); border-radius: 4px; color: inherit; text-decoration: none; transition: border-color 0.15s; }
    .tools a:hover { border-color: var(--accent); }
    .tools a:hover h2 { color: var(--accent-hover); }
    .tools a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tools h2 { color: var(--accent); }
    footer { font-size: 0.95rem; color: var(--ink-muted); }
    @media (prefers-reduced-motion: reduce) { .tools a { transition: none; } }
  </style>
</head>
<body>
  <main>
    <h1>AD&amp;D Campaign</h1>
    <ul class="tools">
      <li>
        <a href="legacy/character-sheet.html">
          <h2>Character Sheet</h2>
          <p>Your character. Save it to a file and load it again next session.</p>
        </a>
      </li>
      <li>
        <a href="legacy/dm-helper.html">
          <h2>DM Helper</h2>
          <p>Initiative, attacks, saves and reactions. Import the party's sheets from Config.</p>
        </a>
      </li>
    </ul>
    <footer>Saves stay on your own computer until accounts arrive.</footer>
  </main>
</body>
</html>
