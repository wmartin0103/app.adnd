<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Directions (proposal)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<!-- A proposal, not wired to the app: three colour directions, each in light
     and dark, drawn with the same parts (sizes S/M/L, Primary and Secondary
     buttons with a Destructive theme, icon buttons, tab buttons, inputs,
     selects, a card, a well, a raised menu). Every colour pairing's contrast
     is measured live on the page. -->
<style>
  /* ── The proposed system (colour values come from the direction) ── */
  .theme {
    --ctl-sm: 1.75rem; --ctl-md: 2.25rem; --ctl-lg: 2.75rem;       /* 28 / 36 / 44px: one height per size for every bordered control */
    --fs-sm: 0.8125rem; --fs-md: 0.9375rem; --fs-lg: 1.0625rem;     /* 13 / 15 / 17px */
    --ico-sm: 0.875rem; --ico-md: 1rem; --ico-lg: 1.25rem;
    --pad-sm: 0.5rem; --pad-md: 0.75rem; --pad-lg: 1rem;
    --radius-ctl: 6px; --radius-card: 10px;
    --font-display: 'Cinzel', Georgia, serif;
    --font-ui: var(--ui-face, 'Source Sans 3'), system-ui, sans-serif;
    font-family: var(--font-ui); color: var(--text); background: var(--bg);
    border-radius: 14px; padding: 22px; display: grid; gap: 18px; align-content: start;
  }
  .theme.light.deep { --e1: 0 1px 3px rgb(15 23 42 / .10), 0 6px 14px rgb(15 23 42 / .08); --e2: 0 20px 44px rgb(15 23 42 / .20), 0 4px 10px rgb(15 23 42 / .10); }
  .theme.light { --e1: 0 1px 2px rgb(20 16 12 / .06), 0 1px 3px rgb(20 16 12 / .10); --e2: 0 10px 28px rgb(20 16 12 / .14), 0 2px 6px rgb(20 16 12 / .08); --edge-hi: transparent; }
  /* Dark: depth from lighter surfaces and a faint top edge; shadows only deepen */
  .theme.dark { --e1: 0 1px 2px rgb(0 0 0 / .5); --e2: 0 14px 34px rgb(0 0 0 / .55), 0 2px 6px rgb(0 0 0 / .4); --edge-hi: rgb(255 255 255 / .06); color-scheme: dark; }
  .theme .mode { font: 600 0.7rem var(--font-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .theme h3 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .04em; margin: 0; }
  .theme p { margin: 0; }
  .t-muted { color: var(--muted); } .t-faint { color: var(--faint); }

  /* The app's header bar: brand colour carried by the chrome; page tabs underline in the second accent */
  .bar { background: var(--bar); color: var(--barText); border-radius: var(--radius-card); padding: 10px 16px 0; display: grid; gap: 6px; box-shadow: var(--e1); }
  .bar.line { box-shadow: none; border: 1px solid var(--divider); }   /* a light header: a rule, not a block */
  .bar .brand { font: 700 1.05rem var(--font-display); letter-spacing: .06em; color: var(--barTitle); display: flex; justify-content: space-between; align-items: center; }
  .bar .brand small { font: 500 .8rem var(--font-ui); letter-spacing: 0; color: var(--barMuted); }
  .bar nav { display: flex; gap: 18px; }
  .bar nav a { color: var(--barMuted); text-decoration: none; font: 600 .85rem var(--font-ui); padding: 6px 0 8px; border-bottom: 3px solid transparent; }
  .bar nav a[aria-current="page"] { color: var(--barText); border-bottom-color: var(--barActive); }
  /* Surfaces: page → card (e1) → raised menu (e2); wells sink */
  .card { background: var(--surface); border-radius: var(--radius-card); box-shadow: var(--e1), inset 0 1px 0 var(--edge-hi); padding: 16px; display: grid; gap: 12px; border: 1px solid var(--divider); }
  .well { background: var(--sunken); border-radius: 8px; padding: 12px; display: grid; gap: 8px; box-shadow: inset 0 1px 2px rgb(0 0 0 / .08); }
  .raised { background: var(--raised); border-radius: 8px; box-shadow: var(--e2), inset 0 1px 0 var(--edge-hi); border: 1px solid var(--divider); padding: 4px; display: grid; width: 13rem; }
  .raised div { padding: 7px 10px; border-radius: 5px; font-size: var(--fs-md); }
  .raised div.on { background: var(--sunken); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .lbl { font: 600 0.68rem var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: grid; gap: 4px; }

  /* Bordered controls: S / M / L share heights, so a row lines up */
  .ctl { box-sizing: border-box; height: var(--h); font: 500 var(--fs) var(--font-ui); border-radius: var(--radius-ctl); padding: 0 var(--px); }
  .sm { --h: var(--ctl-sm); --fs: var(--fs-sm); --px: var(--pad-sm); --ico: var(--ico-sm); }
  .md { --h: var(--ctl-md); --fs: var(--fs-md); --px: var(--pad-md); --ico: var(--ico-md); }
  .lg { --h: var(--ctl-lg); --fs: var(--fs-lg); --px: var(--pad-lg); --ico: var(--ico-lg); }
  input.ctl, select.ctl { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  input.ctl::placeholder { color: var(--faint); }
  select.ctl { appearance: none; padding-right: calc(var(--px) + 1.1em); cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - var(--px) - .45em) 55%, calc(100% - var(--px) - .1em) 55%; background-size: .35em .35em; background-repeat: no-repeat; }
  .ctl:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; gap: .4em; border: 1px solid transparent; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn svg { width: var(--ico); height: var(--ico); flex: none; }
  .btn.icon { width: var(--h); padding: 0; justify-content: center; }
  .primary { background: var(--accent); color: var(--onAccent); border-color: var(--accentEdge, var(--accent)); }
  .primary:hover { background: var(--accentStrong); }
  .secondary { background: var(--surface); color: var(--accentText); border-color: var(--border); }
  .secondary:hover { border-color: var(--accentText); }
  /* Destructive, never the action colour: filled red with a red edge; outlined, the standard border with red text */
  .primary.danger { background: var(--danger); color: var(--onDanger); border-color: var(--danger); }
  .secondary.danger { color: var(--dangerText); }
  .secondary.danger:hover { border-color: var(--dangerText); }
  /* Tab buttons: pick one of three or more */
  .tabs { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-ctl); overflow: hidden; height: var(--h); box-sizing: border-box; }
  .tabs button { font: 600 var(--fs) var(--font-ui); padding: 0 var(--px); border: 0; border-left: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; }
  .tabs button:first-child { border-left: 0; }
  .tabs button[aria-pressed="true"] { background: var(--accent2); color: var(--onAccent2); box-shadow: inset 0 0 0 1.5px var(--accent2Text); }

  /* A roll result in the well */
  .die { width: 2.6rem; height: 2.6rem; display: grid; place-items: center; border-radius: 8px; font: 700 1.2rem var(--font-display); background: var(--surface); border: 2px solid var(--accent2Text); color: var(--accent2Text); }
  .crit { display: inline-flex; padding: 3px 9px; border-radius: 999px; font: 700 .65rem var(--font-ui); letter-spacing: .12em; text-transform: uppercase; background: var(--highlightFill); color: var(--onHighlight); }
  .card.featured { border-top: 3px solid var(--accent2); }
  .kicker { font: 700 .7rem var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--accent2Text); }
  .big { font: 700 1.6rem var(--font-display); color: var(--successText); }   /* an outcome, not an action: never the action colour */
  .hit { color: var(--successText); font-weight: 600; }
  .miss { color: var(--dangerText); font-weight: 600; }

  /* Contrast figures */
  table.cr { border-collapse: collapse; font-size: .78rem; width: 100%; }
  table.cr td { padding: 3px 6px; border-top: 1px solid var(--divider); }
  table.cr td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  .pass { color: var(--successText); } .fail { color: var(--dangerText); font-weight: 700; }
  .sw { display: inline-block; width: .8em; height: .8em; border-radius: 2px; vertical-align: -1px; margin-right: 3px; border: 1px solid rgb(128 128 128 / .4); }

  /* The page around the proposal (outside the system) */
  body { margin: 0; background: #e9e9ec; color: #1c1c1f; font: 16px/1.45 system-ui, sans-serif; }
  .page { max-width: 78rem; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 16px; }
  .page h1 { font-size: 1.3rem; margin: 0; }
  .note { margin: 0; color: #4a4a50; max-width: 60rem; }
  .pick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pick button { font: inherit; padding: 6px 12px; border: 1px solid #a6a6ad; background: #fff; border-radius: 6px; cursor: pointer; }
  .pick button[aria-pressed="true"] { background: #1c1c1f; color: #fff; border-color: #1c1c1f; }
  .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr)); gap: 16px; }
</style>
</head>
<body>
<div class="page">
  <h1>Midnight &amp; Brass: brass-led light themes</h1>
  <p class="note">Dark stays as liked (right). A3 with the brass a little more saturated (A3+), beside A3 and the original A for reference. Contrast is measured live.</p>
  <div class="pick" role="group" aria-label="Direction"><b>Light theme</b><span id="dirs"></span></div>
  <div class="pick" role="group" aria-label="Interface type"><b>Interface type</b>
    <button type="button" data-face="Source Sans 3" aria-pressed="true">Source Sans 3 (sans)</button>
    <button type="button" data-face="Crimson Pro" aria-pressed="false">Crimson Pro (today's serif)</button>
  </div>
  <div class="pair" id="pair"></div>
</div>
<script>
const DIRS = {"a3s":{"name":"A3+ · a little more brass","light":{"danger":"#a03f3c","onDanger":"#fefbfb","dangerText":"#983b38","successText":"#286648","highlightFill":"#96ddb6","onHighlight":"#0e271b","text":"#0f1923","muted":"#414f5d","faint":"#596571","border":"#687686","bg":"#eef2f6","surface":"#fdfeff","raised":"#fdfeff","sunken":"#e3e8ee","divider":"#d8dde3","accent":"#dcaf6c","accentStrong":"#ce9e58","onAccent":"#261a09","accentText":"#754f19","focus":"#835a20","accentEdge":"#966b2e","accent2":"#334a62","onAccent2":"#f6f9fb","accent2Text":"#334a62","bar":"#1b222a","barText":"#f0f2f4","barMuted":"#b0b8c1","barTitle":"#e8bc7d","barActive":"#e3b572"},"dark":{"bg":"#0a0f14","surface":"#12181e","raised":"#1b2129","sunken":"#06080d","divider":"#242b33","text":"#ebeff4","muted":"#b2bbc8","faint":"#969fab","border":"#5f6a77","accent":"#dcaf61","accentStrong":"#edc47d","accentText":"#e0b771","onAccent":"#201300","focus":"#e0b771","accent2":"#9bbeff","onAccent2":"#0d1a32","accent2Text":"#a5c5fe","danger":"#f07f77","onDanger":"#290b0a","dangerText":"#f4928a","successText":"#6ccea6","bar":"#04080d","barText":"#ebeff4","barMuted":"#a3acb8","barTitle":"#e6bd77","barActive":"#e3b667","highlightFill":"#5ed8a9","onHighlight":"#002115","accentEdge":"#dcaf61"}},"a3":{"name":"A3 · Antique, ink header","light":{"danger":"#b02a2d","onDanger":"#fefbfb","dangerText":"#a5292b","successText":"#286648","highlightFill":"#96ddb6","onHighlight":"#0e271b","text":"#0f1923","muted":"#414f5d","faint":"#596571","border":"#687686","bg":"#eef2f6","surface":"#fdfeff","raised":"#fdfeff","sunken":"#e3e8ee","divider":"#d8dde3","accent":"#d8b079","accentStrong":"#c9a066","onAccent":"#261a09","accentText":"#735025","focus":"#805b2c","accentEdge":"#926d3d","accent2":"#334a62","onAccent2":"#f6f9fb","accent2Text":"#334a62","bar":"#1b222a","barText":"#f0f2f4","barMuted":"#b0b8c1","barTitle":"#e3bd8a","barActive":"#deb67f"},"dark":{"bg":"#0a0f14","surface":"#12181e","raised":"#1b2129","sunken":"#06080d","divider":"#242b33","text":"#ebeff4","muted":"#b2bbc8","faint":"#969fab","border":"#5f6a77","accent":"#dcaf61","accentStrong":"#edc47d","accentText":"#e0b771","onAccent":"#201300","focus":"#e0b771","accent2":"#9bbeff","onAccent2":"#0d1a32","accent2Text":"#a5c5fe","danger":"#f07f77","onDanger":"#290b0a","dangerText":"#f4928a","successText":"#6ccea6","bar":"#04080d","barText":"#ebeff4","barMuted":"#a3acb8","barTitle":"#e6bd77","barActive":"#e3b667","highlightFill":"#5ed8a9","onHighlight":"#002115","accentEdge":"#dcaf61"}},"a":{"name":"A · Brass-led","light":{"danger":"#b02a2d","onDanger":"#fefbfb","dangerText":"#a5292b","successText":"#13684b","highlightFill":"#70ddb1","onHighlight":"#02291c","text":"#101924","muted":"#424e5e","faint":"#5a6472","border":"#697686","bg":"#ebf1f8","surface":"#fdfdfe","raised":"#fdfdfe","sunken":"#dfe7f1","divider":"#d4dbe5","accent":"#e4b154","accentStrong":"#d5a13c","onAccent":"#261700","accentText":"#775300","focus":"#825b00","accentEdge":"#93690d","accent2":"#1d438c","onAccent2":"#f7f8fc","accent2Text":"#1d438c","bar":"#0f1e3b","barText":"#f2f5fb","barMuted":"#b3bed2","barTitle":"#f2c26f","barActive":"#edbb64"},"dark":{"bg":"#0a0f14","surface":"#12181e","raised":"#1b2129","sunken":"#06080d","divider":"#242b33","text":"#ebeff4","muted":"#b2bbc8","faint":"#969fab","border":"#5f6a77","accent":"#dcaf61","accentStrong":"#edc47d","accentText":"#e0b771","onAccent":"#201300","focus":"#e0b771","accent2":"#9bbeff","onAccent2":"#0d1a32","accent2Text":"#a5c5fe","danger":"#f07f77","onDanger":"#290b0a","dangerText":"#f4928a","successText":"#6ccea6","bar":"#04080d","barText":"#ebeff4","barMuted":"#a3acb8","barTitle":"#e6bd77","barActive":"#e3b667","highlightFill":"#5ed8a9","onHighlight":"#002115","accentEdge":"#dcaf61"}}};
const CHECKS = [
  ['Body text', 'text', 'surface', 7], ['Body text on page', 'text', 'bg', 7], ['Text in a well', 'text', 'sunken', 7],
  ['Muted text', 'muted', 'surface', 4.5], ['Placeholder', 'faint', 'surface', 4.5],
  ['Control border', 'border', 'surface', 3], ['Border in a well', 'border', 'sunken', 3], ['Focus ring', 'focus', 'surface', 3],
  ['Primary button', 'onAccent', 'accent', 4.5], ['Secondary button', 'accentText', 'surface', 4.5],
  ['Destructive filled', 'onDanger', 'danger', 4.5], ['Destructive outlined', 'dangerText', 'surface', 4.5],
  ['Hit', 'successText', 'surface', 4.5], ['Crit badge', 'onHighlight', 'highlightFill', 4.5],
  ['Second accent text', 'accent2Text', 'surface', 4.5], ['Selected tab', 'onAccent2', 'accent2', 4.5],
  ['Header text', 'barText', 'bar', 7], ['Header title', 'barTitle', 'bar', 4.5], ['Header muted', 'barMuted', 'bar', 4.5], ['Current page mark', 'barActive', 'bar', 3],
];
const hex = h => [0, 2, 4].map(i => parseInt(h.slice(1 + i, 3 + i), 16) / 255);
const lum = h => { const [r, g, b] = hex(h).map(c => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); };
const ICON = { plus: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>',
  copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="5.5" y="5.5" width="8" height="8" rx="1.2"/><path d="M3.5 10.5h-.8a1.2 1.2 0 0 1-1.2-1.2V2.7a1.2 1.2 0 0 1 1.2-1.2h6.6a1.2 1.2 0 0 1 1.2 1.2v.8"/></svg>',
  trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6.5 4V2.5h3V4M4 4l.7 9.2a1 1 0 0 0 1 .8h4.6a1 1 0 0 0 1-.8L12 4"/></svg>',
  d20: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5Z M5 6.5h6L8 12Z"/></svg>' };

function themePanel(dir, mode) {
  const t = DIRS[dir][mode];
  const vars = Object.entries(t).map(([k, v]) => `--${k}:${v}`).join(';');
  const size = s => `
    <div class="row">
      <label class="lbl">Name<input class="ctl ${s}" placeholder="e.g. Goblin" style="width:8rem"></label>
      <label class="lbl">Ground<select class="ctl ${s}"><option>Level</option><option>Higher</option></select></label>
      <button class="ctl ${s} btn primary">${ICON.d20}Roll to hit</button>
      <button class="ctl ${s} btn secondary">${ICON.plus}Add</button>
      <button class="ctl ${s} btn secondary icon" aria-label="Duplicate">${ICON.copy}</button>
      <button class="ctl ${s} btn secondary danger icon" aria-label="Remove">${ICON.trash}</button>
    </div>`;
  const rows = CHECKS.map(([label, a, b, need]) => {
    const r = ratio(t[a], t[b]);
    return `<tr><td><span class="sw" style="background:${t[a]}"></span><span class="sw" style="background:${t[b]}"></span>${label}</td><td class="${r >= need ? 'pass' : 'fail'}">${r.toFixed(1)} : 1 ${r >= 7 ? 'AAA' : r >= 4.5 ? 'AA' : r >= 3 ? 'UI' : ''}</td></tr>`;
  }).join('');
  return `<section class="theme ${mode}${t.deep ? ' deep' : ''}" style="${vars}" aria-label="${DIRS[dir].name}, ${mode}">
    <span class="mode">${DIRS[dir].name} · ${mode}</span>
    <header class="bar${t.barLine ? ' line' : ''}"><div class="brand">AD&amp;D Campaign <small>Signed in as Sam</small></div>
      <nav aria-label="Pages"><a href="#" aria-current="page">Characters</a><a href="#">Initiative</a><a href="#">Saves</a><a href="#">Account</a></nav></header>
    <div class="card featured">
      <span class="kicker">In play</span>
      <h3>Brannoc Thale</h3>
      <p>Human Fighter 6 <span class="t-muted">· In play</span> <span class="t-faint">· Saved today</span></p>
      <div class="lbl">Small</div>${size('sm')}
      <div class="lbl">Medium</div>${size('md')}
      <div class="lbl">Large</div>${size('lg')}
      <div class="row">
        <div class="tabs md" role="group" aria-label="Ground"><button type="button" aria-pressed="false">Lower</button><button type="button" aria-pressed="true">Level</button><button type="button" aria-pressed="false">Higher</button></div>
        <button class="ctl md btn primary danger">${ICON.trash}Delete</button>
        <button class="ctl md btn secondary danger">Clear all</button>
      </div>
      <div class="well">
        <div class="row" style="align-items:center; gap:14px">
          <span class="die">20</span>
          <span><span class="lbl">Result</span><span class="big">Hit</span></span>
          <span><span class="lbl">Damage</span><b style="font-size:1.4rem">9</b> <span class="t-muted">1d8+1: 8 + 1</span></span>
          <span class="crit">Natural 20 · Critical hit</span>
        </div>
        <p class="t-muted"><span class="hit">Hit</span> Jaque · <span class="miss">Miss</span> Goroth · AC 4, needs 16</p>
      </div>
      <div class="raised" role="presentation"><div>Bring into play</div><div class="on">Move to Backups</div><div style="color:var(--dangerText)">Delete…</div></div>
    </div>
    <div class="card"><table class="cr">${rows}</table></div>
  </section>`;
}
let dir = 'a3s';
function render() {
  document.getElementById('pair').innerHTML = themePanel(dir, 'light') + themePanel(dir, 'dark');
  document.querySelectorAll('#dirs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
}
document.getElementById('dirs').innerHTML = Object.entries(DIRS).map(([k, d]) => `<button type="button" data-dir="${k}">${d.name}</button>`).join(' ');
document.getElementById('dirs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { dir = b.dataset.dir; render(); } });
document.querySelectorAll('[data-face]').forEach(b => b.addEventListener('click', () => {
  document.documentElement.style.setProperty('--ui-face', `'${b.dataset.face}'`);
  document.querySelectorAll('[data-face]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
}));
render();
</script>
</body>
</html>
