# Publishes the site to GitHub Pages on every push to the working branch:
# runs the tests, builds dist/ (the landing page, the two tools and the spell
# catalog; nothing else from the repo), and deploys it.
# One-time setup in the repo: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [claude/vibrant-wozniak-gjkyjd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces one waiting to start
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
